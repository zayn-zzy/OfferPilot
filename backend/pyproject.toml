[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offerpilot-api"
version = "0.1.0"
description = "OfferPilot job-search assistant API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "email-validator>=2.1,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "pypdf>=5.1,<7",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.6,<3",
    "PyJWT>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
offerpilot-research-mcp = "app.services.company_research:run_company_research_mcp"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["app*"]
