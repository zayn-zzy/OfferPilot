services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-offerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-offerpilot_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-offerpilot} -d ${POSTGRES_DB:-offerpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      OFFERPILOT_ENVIRONMENT: ${OFFERPILOT_ENVIRONMENT:-development}
      OFFERPILOT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-offerpilot}:${POSTGRES_PASSWORD:-offerpilot_dev}@db:5432/${POSTGRES_DB:-offerpilot}
      OFFERPILOT_SECRET_KEY: ${OFFERPILOT_SECRET_KEY:-}
      OFFERPILOT_ALLOWED_ORIGINS: ${OFFERPILOT_ALLOWED_ORIGINS:-["http://localhost:3000"]}
      OFFERPILOT_LLM_BASE_URL: ${OFFERPILOT_LLM_BASE_URL:-}
      OFFERPILOT_LLM_API_KEY: ${OFFERPILOT_LLM_API_KEY:-}
      OFFERPILOT_LLM_MODEL: ${OFFERPILOT_LLM_MODEL:-}
      OFFERPILOT_LLM_TIMEOUT_SECONDS: ${OFFERPILOT_LLM_TIMEOUT_SECONDS:-30}
      OFFERPILOT_LLM_LOW_CONFIDENCE_THRESHOLD: ${OFFERPILOT_LLM_LOW_CONFIDENCE_THRESHOLD:-0.75}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - resume_storage:/app/storage
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  web:
    image: oven/bun:1
    working_dir: /app
    environment:
      OFFERPILOT_API_URL: ${OFFERPILOT_API_URL:-http://api:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0"]

volumes:
  postgres_data:
  resume_storage:
  frontend_node_modules:
